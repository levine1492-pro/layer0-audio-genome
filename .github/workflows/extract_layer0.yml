name: Layer 0 v2 Audio Genome Engine

on:
  push:
    branches: [ main ]
    paths:
      - 'links_queue.txt'
      - 'bootstrap_v2.py'
      - 'engine/**'
      - 'run_pipeline.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Decomposition mode'
        required: true
        default: 'stems'
        type: choice
        options:
          - stems
          - fast
      force_reprocess:
        description: 'Re-run already processed links (ignores DB cache)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack modular engine if bootstrap_v2.py exists
        run: |
          if [ -f bootstrap_v2.py ]; then
            python3 bootstrap_v2.py
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v2-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-v2-

      - name: Cache Demucs htdemucs weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: ${{ runner.os }}-htdemucs-v4

      - name: Install CPU PyTorch & DSP stack
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Layer 0 v2 Genome Pipeline
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.mode }}" = "fast" ]; then
            FLAGS="$FLAGS --fast"
          fi
          if [ "${{ github.event.inputs.force_reprocess }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          python run_pipeline.py $FLAGS

      - name: Commit engine, dossiers, genomes & SQLite catalog
        run: |
          git config user.name "layer0-bot"
          git config user.email "layer0-bot@users.noreply.github.com"
          for p in engine run_pipeline.py requirements.txt archive db latest_dossier.md links_queue.txt; do
            [ -e "$p" ] && git add "$p"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Layer 0 v2: updated genome capture & catalog [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No changes to commit."
          fi
